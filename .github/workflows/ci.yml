name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wedding_guest_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wedding_guest_manager_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wedding_guest_manager_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wedding_guest_manager_test
      AUTH_SECRET: ci-auth-secret-change-me
      AUTH_URL: http://127.0.0.1:3000
      AUTH_TRUST_HOST: "true"
      NODE_OPTIONS: --max-old-space-size=4096
      RSVP_OTP_TEST_ORIGIN: http://127.0.0.1:3097
      CAPTCHA_TEST_ORIGIN: http://127.0.0.1:3097
      TURNSTILE_SITE_KEY: local-test-site-key
      TURNSTILE_SECRET_KEY: local-test-secret
      TWILIO_VERIFY_SERVICE_SID: VA0123456789abcdef0123456789abcdef
      TWILIO_API_SECRET: ci-local-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate local verification fixture key
        run: echo "TWILIO_API_KEY=SK$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Seed demo data
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run HTTP and browser tests
        run: |
          node scripts/mock-rsvp-otp.mjs > /tmp/wedding-otp.log 2>&1 &
          OTP_PID=$!
          PORT=3000 npm run start > /tmp/wedding-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" "$OTP_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/auth/login >/dev/null && curl -sf "$RSVP_OTP_TEST_ORIGIN/health" >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/auth/login >/dev/null || { cat /tmp/wedding-server.log; exit 1; }
          curl -fsS "$RSVP_OTP_TEST_ORIGIN/health" >/dev/null || { cat /tmp/wedding-otp.log; exit 1; }
          npm run test:smoke
          PLAYWRIGHT_BASE_URL="$AUTH_URL" npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
